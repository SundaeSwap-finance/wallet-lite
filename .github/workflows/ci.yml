name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write # required to use OIDC authentication
  contents: write # required to checkout and push to the repo

jobs:
  Publish:
    name: Lint + Test + Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-node@v3
        with:
          node-version: 20

      # Git Identity
      - name: Git Identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Test
        run: bun test

      - name: Build
        run: |
          cd lib
          bun run build

      # Bump Versions (reinstate after release)
      - name: Bump versions
        run: |
          cd lib
          bun version

      # Pull latest changes and rebase before pushing
      - name: Pull and Push changes
        run: |
          git pull --rebase --no-verify origin main
          git push --follow-tags --no-verify origin main

      # Trusted publishing needs npm 11.5.1+, and node 20 ships npm 10, so
      # upgrade npm here. Node 24 bundles a new enough npm, but we can't move to
      # it yet: @fabianbormann/cardano-peer-connect 1.2.17 pulls in
      # node-datachannel 0.9.1 (via meerkat > webrtc-polyfill), whose install
      # script has no node 24 prebuild and crashes building from source.
      #
      # TODO: upgrade cardano-peer-connect to >=1.2.19, which drops meerkat (and
      # node-datachannel) for peerjs. That's a breaking transport change for
      # CIP-45, so check P2P wallet connects still work. Then drop
      # node-datachannel from trustedDependencies, move this workflow and
      # branch.yml to node 24, and delete this step.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # Publishes via npm trusted publishing (OIDC, from `id-token: write`):
      # npmjs.com must list this workflow as the package's Trusted Publisher.
      - name: Publish
        run: |
          cd lib
          npm publish
